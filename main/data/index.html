<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESPID-Coffee</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1>ESPID-Coffee</h1>

  <h2>Wi-Fi Provisioning</h2>
  <p>AP: <strong id="ap-ssid">ESPID-Coffee</strong></p>
  <form method="POST" action="/wifi">
    <label>Wi-Fi SSID
      <input name="ssid" id="ssid" maxlength="32" required autocomplete="off">
    </label>
    <label>Password
      <span class="pw-wrap">
        <input id="pwd" name="password" type="password" maxlength="64" autocomplete="new-password">
        <button type="button" id="show-pw">Show</button>
      </span>
    </label>
    <button type="submit">Save &amp; Reboot</button>
  </form>

  <h2>Machine Settings</h2>
  <form method="POST" action="/settings">
    <label>PID Kp          <input name="pid_kp"          id="pid_kp"></label>
    <label>PID Tn (s)      <input name="pid_tn"          id="pid_tn"></label>
    <label>PID Tv (s)      <input name="pid_tv"          id="pid_tv"></label>
    <label>Brew PID Kp     <input name="brew_kp"         id="brew_kp"></label>
    <label>Brew PID Tn (s, 0 = hold I) <input name="brew_tn" id="brew_tn"></label>
    <label>Brew PID Tv (s) <input name="brew_tv"         id="brew_tv"></label>
    <label>Brew PID trailing (s) <input name="brew_trail" id="brew_trail"></label>
    <label>Brew heat pulse (s, 0 = off) <input name="brew_pulse" id="brew_pulse"></label>
    <label>Pump PID Kp     <input name="pump_kp"         id="pump_kp"></label>
    <label>Pump PID Ki     <input name="pump_ki"         id="pump_ki"></label>
    <label>Pump PID Kd     <input name="pump_kd"         id="pump_kd"></label>
    <label>Brew setpoint (&deg;C)   <input name="brew_sp"   id="brew_sp"></label>
    <label>Steam setpoint (&deg;C)  <input name="steam_sp"  id="steam_sp"></label>
    <label>Brew time (s)   <input name="brew_t"          id="brew_t"></label>
    <label>Preinfusion (s) <input name="preinf_t"        id="preinf_t"></label>
    <label>Preinf. pause (s) <input name="preinf_pause_t" id="preinf_pause_t"></label>
    <label>MQTT host       <input name="mqtt_host"       id="mqtt_host"></label>
    <label>MQTT port       <input name="mqtt_port"       id="mqtt_port"></label>
    <label>MQTT username   <input name="mqtt_user"       id="mqtt_user"></label>
    <label>MQTT password   <input name="mqtt_pass"       id="mqtt_pass" type="password" autocomplete="new-password"></label>
    <label>MQTT client ID  <input name="mqtt_client"     id="mqtt_client"></label>
    <label>HawkBit server  <input name="hb_server"       id="hb_server" placeholder="https://hawkbit.example.com"></label>
    <label>HawkBit token   <input name="hb_token"        id="hb_token"  type="password" autocomplete="new-password"></label>
    <button type="submit">Save Settings</button>
  </form>

  <h2>Standby</h2>
  <p>Clock: <strong id="pw-clock">&ndash;</strong> &middot;
     next wake: <strong id="pw-next">&ndash;</strong> &middot;
     standby in: <strong id="pw-left">&ndash;</strong></p>
  <form method="POST" action="/power">
    <label>Sleep when idle
      <select name="sb_en" id="sb_en">
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>
    </label>
    <label>Idle time before sleep (min) <input name="sb_min" id="sb_min" type="number" min="5" max="720" required></label>
    <label>Wake every day
      <select name="wk_en" id="wk_en">
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>
    </label>
    <label>Wake time (heater on) <input name="wk_time" id="wk_time" type="time" required></label>
    <button type="submit">Save Standby</button>
  </form>

  <p class="note">
    Leave Wi-Fi password empty for open networks.
    Machine settings are persisted in NVS.
  </p>

  <script src="/app.js"></script>
</body>
</html>
